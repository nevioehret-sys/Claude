// ---------- State / Storage ----------
const STORAGE_KEY = "biolearn_progress_v1";
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function masteryFor(topicId){
  const total = TOPICS.find(t=>t.id===topicId).cards.length;
  const known = (progress[topicId]?.known) || [];
  return Math.round((known.length/total)*100);
}
function overallProgress(){
  let totalCards=0, totalKnown=0;
  TOPICS.forEach(t=>{
    totalCards += t.cards.length;
    totalKnown += (progress[t.id]?.known||[]).length;
  });
  return Math.round((totalKnown/totalCards)*100);
}

const app = document.getElementById("app");

function renderHome(){
  const op = overallProgress();
  app.innerHTML = `
    <div class="progressbar"><div style="width:${op}%"></div></div>
    <p style="color:var(--muted);margin:-14px 0 14px;font-size:.8rem;">Gesamtfortschritt: ${op}%</p>
    <div class="grid">
      ${TOPICS.map((t,i)=>`
        <div class="topic-card" onclick="openTopic('${t.id}')">
          <div class="num">THEMA ${String(i+1).padStart(2,'0')}</div>
          <h3>${t.title}</h3>
          <p>${t.desc}</p>
          <span class="tag">${t.tag}</span>
          <div class="mastery"><div style="width:${masteryFor(t.id)}%"></div></div>
        </div>
      `).join("")}
    </div>
  `;
}

function openTopic(id, tab){
  const t = TOPICS.find(x=>x.id===id);
  tab = tab || "notes";
  app.innerHTML = `
    <button class="btn btn-ghost backbtn" onclick="renderHome()">← Übersicht</button>
    <h2 style="margin:0 0 4px;">${t.title}</h2>
    <p style="color:var(--muted);margin:0 0 10px;">${t.desc}</p>
    <div class="tabs">
      <button data-tab="notes" class="${tab==='notes'?'active':''}" onclick="openTopic('${id}','notes')">📘 Zusammenfassung</button>
      <button data-tab="video" class="${tab==='video'?'active':''}" onclick="openTopic('${id}','video')">🎬 Lernvideo</button>
      <button data-tab="quiz" class="${tab==='quiz'?'active':''}" onclick="openTopic('${id}','quiz')">🧠 Karteikarten</button>
    </div>
    <div id="topic-panel"></div>
  `;
  const panel = document.getElementById("topic-panel");
  if(tab==="notes") panel.innerHTML = renderNotes(t);
  if(tab==="video") panel.innerHTML = renderVideo(t);
  if(tab==="quiz") renderQuiz(t, panel);
}

function renderNotes(t){
  return t.sections.map(s=>`
    <div class="note-section">
      <h4>${s.h}</h4>
      <ul>${s.items.map(i=>`<li>${i}</li>`).join("")}</ul>
    </div>
  `).join("") + (t.merksatz? `<div class="merksatz">💡 ${t.merksatz}</div>` : "");
}

function renderVideo(t){
  const url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(t.videoQuery);
  return `
    <div class="video-box">
      <div class="yticon">🎥</div>
      <h3>Kurzes Lernvideo zu „${t.title}“</h3>
      <p style="color:var(--muted);max-width:420px;margin:8px auto 18px;">
        Öffnet eine YouTube-Suche mit passenden Erklärvideos (z.B. von musstewissen Biologie) zu diesem Thema.
      </p>
      <a href="${url}" target="_blank" rel="noopener"><button class="btn btn-primary">▶ Video suchen & ansehen</button></a>
    </div>
  `;
}

// ---------- Quiz / Anki-style flashcards ----------
function renderQuiz(t, panel){
  const known = new Set((progress[t.id]?.known)||[]);
  let queue = t.cards.map((c,i)=>i).filter(i=>!known.has(i));
  if(queue.length===0) queue = t.cards.map((c,i)=>i); // alle wiederholen wenn schon alles gewusst
  queue = shuffle(queue);
  let idx = 0, flipped = false;

  function draw(){
    if(idx >= queue.length){
      panel.innerHTML = `
        <div class="done-screen">
          <div class="big">🎉</div>
          <h3>Runde abgeschlossen!</h3>
          <p style="color:var(--muted)">Gewusst: ${(progress[t.id]?.known||[]).length} / ${t.cards.length} Karten</p>
          <button class="btn btn-primary" onclick="openTopic('${t.id}','quiz')">🔁 Nochmal</button>
        </div>`;
      return;
    }
    const cardIdx = queue[idx];
    const c = t.cards[cardIdx];
    panel.innerHTML = `
      <div class="flash-wrap">
        <p class="flash-meta">Karte ${idx+1} / ${queue.length}</p>
        <div class="flashcard" id="fc">
          <span class="label">${flipped? 'ANTWORT' : 'FRAGE'}</span>
          <div>${flipped? c.a : c.q}</div>
        </div>
        <div class="flash-actions">
          ${!flipped
            ? `<button class="btn btn-primary" id="flipbtn">Karte umdrehen</button>`
            : `<button class="btn btn-red" id="wrongbtn">❌ Wusste ich nicht</button>
               <button class="btn btn-green" id="rightbtn">✅ Wusste ich</button>`
          }
        </div>
      </div>
    `;
    document.getElementById("fc").onclick = ()=>{ flipped=!flipped; draw(); };
    if(!flipped){
      document.getElementById("flipbtn").onclick = (e)=>{ e.stopPropagation(); flipped=true; draw(); };
    } else {
      document.getElementById("rightbtn").onclick = (e)=>{
        e.stopPropagation();
        markCard(t.id, cardIdx, true);
        idx++; flipped=false; draw();
      };
      document.getElementById("wrongbtn").onclick = (e)=>{
        e.stopPropagation();
        markCard(t.id, cardIdx, false);
        idx++; flipped=false; draw();
      };
    }
  }
  draw();
}

function markCard(topicId, cardIdx, knewIt){
  if(!progress[topicId]) progress[topicId] = {known:[]};
  const known = new Set(progress[topicId].known);
  if(knewIt) known.add(cardIdx); else known.delete(cardIdx);
  progress[topicId].known = Array.from(known);
  saveProgress(progress);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
